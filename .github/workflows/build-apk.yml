name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          if [ ! -d "$ANDROID_SDK_ROOT" ]; then
            echo "ANDROID_SDK_ROOT not found at $ANDROID_SDK_ROOT"
            exit 1
          fi
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT" -path '*cmdline-tools*/bin/sdkmanager' -type f 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "${SDKMANAGER:-}" ] || [ ! -f "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_SDK_ROOT" >&2
            find "$ANDROID_SDK_ROOT" -maxdepth 4 -type f -name sdkmanager || true
            exit 1
          fi
          chmod +x "$SDKMANAGER" || true
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "Using sdkmanager: $SDKMANAGER"

      - name: Install SDK components
        shell: bash
        run: |
          set -euo pipefail
          # Accept licenses (ignore broken-pipe from `yes` when sdkmanager exits)
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          # Install required components; tolerate SIGPIPE from `yes` if sdkmanager succeeds
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" || {
            sdk_rc=${PIPESTATUS[1]:-1}
            yes_rc=${PIPESTATUS[0]:-0}
            if [ "$sdk_rc" -ne 0 ]; then
              echo "sdkmanager install failed with exit code $sdk_rc" >&2
              exit "$sdk_rc"
            fi
            echo "Ignoring yes exit code $yes_rc after successful sdkmanager install"
          }

      - name: Configure SDK path
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify APK signature
        run: |
          ls -lh app/build/outputs/apk/release/
          "${ANDROID_SDK_ROOT}/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: orchid-finance-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
