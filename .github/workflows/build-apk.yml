name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Configure SDK path
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace
      - name: Verify APK signature
        run: |
          ls -lh app/build/outputs/apk/release/
          "${ANDROID_SDK_ROOT}/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: orchid-finance-release-apk
          path: app/build/outputs/apk/release/app-release.apk
